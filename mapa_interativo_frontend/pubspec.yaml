name: mapa_interativo
description: "Aplicação de mapa interativo"

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  uuid: ^4.5.1
  material_symbols_icons: ^4.2766.0
  flutter_map_cancellable_tile_provider: ^3.0.0
