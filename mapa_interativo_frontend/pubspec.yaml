  image_picker: ^1.1.0
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  material_color_utilities: 0.11.1

  dio: ^5.4.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

